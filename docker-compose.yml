services:
  postgres:
    image: postgres:16
    container_name: journeymate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: journeymate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: journeymate123
    ports:
      - "5434:5432"
    volumes:
      - journeymate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journeymate"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  journeymate_pg_data:
