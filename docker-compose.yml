services:
  postgres:
    image: postgres:16
    container_name: journeymate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: journeymate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: journeymate123
    ports:
      - "5434:5432"
    volumes:
      - journeymate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journeymate"]
      interval: 10s
      timeout: 5s
      retries: 10

  insights-bff:
    build:
      context: ./services/insights-bff
    container_name: journeymate-insights-bff
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      INSIGHTS_PORT: 4100
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: journeymate
      PGUSER: postgres
      PGPASSWORD: journeymate123
    ports:
      - "4100:4100"

volumes:
  journeymate_pg_data:
