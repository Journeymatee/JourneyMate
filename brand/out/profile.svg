<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="bgL" cx="18%" cy="14%" r="62%">
      <stop offset="0%"  stop-color="#0f3a2c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgR" cx="84%" cy="88%" r="60%">
      <stop offset="0%"  stop-color="#3a2a08" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#22c55e" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12.29"/>
      <feOffset dx="0" dy="8.19" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgBase)"/>
  <rect width="1024" height="1024" fill="url(#bgL)"/>
  <rect width="1024" height="1024" fill="url(#bgR)"/>

  <circle cx="512" cy="512"
          r="654.95" fill="url(#iconGlow)"/>

  <g filter="url(#iconShadow)">
    <g transform="translate(112.63999999999999 112.64) scale(16.64)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="needle" x1="24" y1="8" x2="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Compass needle north (bright) -->
  <path d="M24 9 L19.5 24 L24 21.5 L28.5 24 Z" fill="white" opacity="0.95"/>
  <!-- Compass needle south (dimmed) -->
  <path d="M24 39 L19.5 24 L24 26.5 L28.5 24 Z" fill="white" opacity="0.38"/>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="2.8" fill="white"/>
  <!-- Cardinal direction dots -->
  <circle cx="24" cy="9.5" r="1.6" fill="rgba(255,255,255,0.8)"/>
  <circle cx="38.5" cy="24" r="1.6" fill="rgba(255,255,255,0.45)"/>
  <circle cx="24" cy="38.5" r="1.6" fill="rgba(255,255,255,0.45)"/>
  <circle cx="9.5" cy="24" r="1.6" fill="rgba(255,255,255,0.45)"/>
</g>
  </g>

</svg>